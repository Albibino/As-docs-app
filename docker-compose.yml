# Stack local: frontend em http://localhost:8080, com backend e IA privados.
# O serviço `ai` é construído do repositório irmão ../As-docs-ai (AS_DOCS_AI_PATH).
# Keycloak opcional (perfil oidc), em http://localhost:9090. Ver docs/tcc/10-keycloak-local.md.
# Para ativar Client Credentials nos dois serviços, adicione docker-compose.oauth.yml.
name: as-docs

services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: as-docs-frontend:local
    environment:
      BACKEND_URL: http://backend:3000
      PUBLIC_APP_URL: '${APP_URL:-http://localhost:8080}'
    ports:
      - '127.0.0.1:8080:8080'
    depends_on:
      - backend
    networks: [public, private]
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: as-docs-backend:local
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      APP_URL: '${APP_URL:-http://localhost:8080}'
      PORT: 3000
      APP_SECRET: '${APP_SECRET:?defina APP_SECRET no .env}'
      DATABASE_URL: 'postgresql://asdocs:${DB_PASSWORD:?defina DB_PASSWORD no .env}@db:5432/asdocs'
      REDIS_URL: 'redis://redis:6379/1'
      MAIL_DRIVER: log
      DISABLE_TELEMETRY: 'true'
      OIDC_ENABLED: '${OIDC_ENABLED:-false}'
      OIDC_ISSUER: '${OIDC_ISSUER:-http://localhost:9090/realms/as-docs}'
      OIDC_BACKCHANNEL_URL: '${OIDC_BACKCHANNEL_URL:-http://keycloak:8080}'
      OIDC_CLIENT_ID: '${OIDC_CLIENT_ID:-docs-app-web}'
      OIDC_CLIENT_SECRET_WEB: '${OIDC_CLIENT_SECRET_WEB:-}'
      JWT_TOKEN_EXPIRES_IN: '${JWT_TOKEN_EXPIRES_IN:-8h}'
      DOCS_AI_URL: 'http://ai:8000'
      DOCS_AI_OAUTH_ENABLED: '${DOCS_AI_OAUTH_ENABLED:-false}'
      OIDC_CLIENT_SECRET_INDEXER: '${OIDC_CLIENT_SECRET_INDEXER:-}'
      OIDC_CLIENT_SECRET_ASSISTANT: '${OIDC_CLIENT_SECRET_ASSISTANT:-}'
      DOCS_AI_HMAC_SECRET: '${DOCS_AI_HMAC_SECRET:-}'
      DOCS_AI_MCP_ENABLED: 'true'
      DOCS_AI_INDEX_INTERVAL_SECONDS: '${DOCS_AI_INDEX_INTERVAL_SECONDS:-30}'
    volumes:
      - app_storage:/app/data/storage
    networks: [private]
    restart: unless-stopped

  ai:
    build: ${AS_DOCS_AI_PATH:-../As-docs-ai}
    image: as-docs-ai:local
    depends_on:
      - redis
    environment:
      PORT: 8000
      REDIS_URL: 'redis://redis:6379/0'
      DOCS_AI_HMAC_SECRET: '${DOCS_AI_HMAC_SECRET:-}'
      AI_OAUTH_ENABLED: '${DOCS_AI_OAUTH_ENABLED:-false}'
      AI_OIDC_ISSUER: '${OIDC_ISSUER:-http://localhost:9090/realms/as-docs}'
      AI_OIDC_JWKS_URL: '${AI_OIDC_JWKS_URL:-http://keycloak:8080/realms/as-docs/protocol/openid-connect/certs}'
      AI_OAUTH_CLIENTS_JSON: '${AI_OAUTH_CLIENTS_JSON:-}'
      AI_EMBEDDING_PROVIDER: '${AI_EMBEDDING_PROVIDER:-hashing}'
      AI_CHAT_PROVIDER: '${AI_CHAT_PROVIDER:-extractive}'
      OPENAI_API_KEY: '${OPENAI_API_KEY:-}'
      OPENAI_MODEL: '${OPENAI_MODEL:-gpt-6-luna}'
      AI_MCP_CLIENT_ENABLED: 'true'
      AI_MCP_SERVER_URL: 'http://backend:3000/mcp'
    networks: [private]
    restart: unless-stopped

  db:
    image: postgres:18
    environment:
      POSTGRES_DB: asdocs
      POSTGRES_USER: asdocs
      POSTGRES_PASSWORD: '${DB_PASSWORD:?defina DB_PASSWORD no .env}'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U asdocs -d asdocs']
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - db_data:/var/lib/postgresql
    networks: [private]
    restart: unless-stopped

  redis:
    # Redis 8 é obrigatório: Vector Sets (VADD/VSIM) são o banco vetorial da IA.
    # DB 0 = IA; DB 1 = backend (filas e cache).
    image: redis:8
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    volumes:
      - redis_data:/data
    networks: [private]
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    profiles: [oidc]
    command: ['start-dev', '--import-realm']
    environment:
      KC_HOSTNAME: 'http://localhost:9090'
      KC_HTTP_ENABLED: 'true'
      KC_HEALTH_ENABLED: 'true'
      KC_DB: postgres
      KC_DB_URL: 'jdbc:postgresql://keycloak-db:5432/keycloak'
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: '${KEYCLOAK_DB_PASSWORD:-}'
      KC_BOOTSTRAP_ADMIN_USERNAME: '${KEYCLOAK_ADMIN_USERNAME:-}'
      KC_BOOTSTRAP_ADMIN_PASSWORD: '${KEYCLOAK_ADMIN_PASSWORD:-}'
    depends_on:
      keycloak-db:
        condition: service_healthy
    ports:
      - '127.0.0.1:9090:8080'
    volumes:
      - ./config/keycloak/as-docs-realm.json:/opt/keycloak/data/import/as-docs-realm.json:ro
    healthcheck:
      # A imagem não inclui curl. A interface de gestão (9000) não é publicada.
      test:
        - CMD
        - bash
        - -ec
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000;
          printf 'HEAD /health/ready HTTP/1.0\r\n\r\n' >&3;
          read -r status <&3;
          [[ "$$status" == 'HTTP/1.0 200 '* || "$$status" == 'HTTP/1.1 200 '* ]]
      interval: 5s
      timeout: 3s
      start_period: 60s
      retries: 24
    networks: [private, keycloak_db]
    restart: unless-stopped

  keycloak-db:
    image: postgres:18
    profiles: [oidc]
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: '${KEYCLOAK_DB_PASSWORD:-}'
    healthcheck:
      test: ['CMD', 'pg_isready', '-h', '127.0.0.1', '-U', 'keycloak', '-d', 'keycloak']
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - keycloak_db_data:/var/lib/postgresql
    networks: [keycloak_db]
    restart: unless-stopped

networks:
  public: {}
  # Na AWS a subnet privada sai para a internet só pelo NAT Gateway (a IA
  # precisa alcançar a API da OpenAI). Aqui a rede não é `internal` pelo mesmo motivo;
  # só as portas listadas acima são publicadas, exclusivamente em loopback.
  private: {}
  keycloak_db:
    internal: true

volumes:
  app_storage:
  db_data:
  redis_data:
  keycloak_db_data:
