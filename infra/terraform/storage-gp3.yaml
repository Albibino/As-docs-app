apiVersion: v1
kind: Namespace
metadata:
  name: as-docs
---
# Policies de egress sao aditivas. Outras policies do namespace tambem devem
# excluir o IMDS; uma regra adicional allow-all anularia esta restricao.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: workload-egress-without-imds
  namespace: as-docs
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except: [169.254.169.254/32]
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
  encrypted: "true"
  csi.storage.k8s.io/fstype: ext4
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Retain
allowVolumeExpansion: true
