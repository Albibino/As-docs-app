---
apiVersion: v1
kind: ConfigMap
metadata:
  name: as-docs-backend-config
  namespace: as-docs
data:
  APP_URL: https://www.asdocs.abrdns.com
  AWS_S3_BUCKET: ''
  AWS_S3_REGION: us-east-1
  DEBUG_MODE: 'false'
  DISABLE_TELEMETRY: 'true'
  DOCS_AI_INDEX_INTERVAL_SECONDS: '30'
  DOCS_AI_MCP_CREDENTIAL_TTL_SECONDS: '120'
  DOCS_AI_MCP_ENABLED: 'true'
  DOCS_AI_OAUTH_ENABLED: 'true'
  DOCS_AI_URL: https://as-docs-ai.as-docs.svc.cluster.local:8443
  JWT_TOKEN_EXPIRES_IN: 30d
  LOG_HTTP: 'false'
  MAIL_DRIVER: log
  OIDC_CLIENT_ID: docs-app-web
  OIDC_ENABLED: 'true'
  OIDC_ISSUER: https://www.asdocs.abrdns.com/id/realms/as-docs
  PORT: '3000'
  REDIS_URL: redis://redis.as-docs.svc.cluster.local:6379/1
  STORAGE_DRIVER: local
  TCC_SKIP_SEED: 'false'
