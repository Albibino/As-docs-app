---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: as-docs-backend-storage
  namespace: as-docs
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: gp3
  resources:
    requests:
      storage: 10Gi
  volumeMode: Filesystem
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: as-docs-backend
  namespace: as-docs
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: as-docs-backend
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: as-docs-backend
    spec:
      containers:
      - env:
        - name: NODE_EXTRA_CA_CERTS
          value: /etc/asdocs/internal-ca/ca.crt
        envFrom:
        - configMapRef:
            name: as-docs-backend-config
        - secretRef:
            name: as-docs-backend-secret
        image: 362749056012.dkr.ecr.us-east-1.amazonaws.com/as-docs-backend:oidc-20261124-121252
        imagePullPolicy: Always
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /api/health/live
            port: 3000
            scheme: HTTP
          periodSeconds: 20
          successThreshold: 1
          timeoutSeconds: 1
        name: backend
        ports:
        - containerPort: 3000
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /api/health/live
            port: 3000
            scheme: HTTP
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 1
        resources:
          limits:
            memory: 1536Mi
          requests:
            cpu: 250m
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        startupProbe:
          failureThreshold: 30
          httpGet:
            path: /api/health/live
            port: 3000
            scheme: HTTP
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 1
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /etc/asdocs/internal-ca
          name: internal-ca
          readOnly: true
        - mountPath: /app/data/storage
          name: storage
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext:
        fsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      terminationGracePeriodSeconds: 30
      volumes:
      - configMap:
          defaultMode: 420
          items:
          - key: ca.crt
            path: ca.crt
          name: as-docs-internal-ca
        name: internal-ca
      - name: storage
        persistentVolumeClaim:
          claimName: as-docs-backend-storage
---
apiVersion: v1
kind: Service
metadata:
  name: as-docs-backend
  namespace: as-docs
spec:
  type: NodePort
  selector:
    app: as-docs-backend
  ports:
  - name: http
    nodePort: 30300
    port: 3000
    protocol: TCP
    targetPort: 3000
  externalTrafficPolicy: Cluster
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-ingress
  namespace: as-docs
spec:
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: as-docs-ai
    - ipBlock:
        cidr: 10.0.0.0/16
    ports:
    - port: 3000
      protocol: TCP
  podSelector:
    matchLabels:
      app: as-docs-backend
  policyTypes:
  - Ingress
