# MODELO. Não versione o arquivo preenchido. Crie o Secret direto:
#   kubectl -n as-docs create secret generic as-docs-backend-secret \
#     --from-literal=APP_SECRET="$(openssl rand -hex 32)" \
#     --from-literal=DOCS_AI_HMAC_SECRET="<mesmo valor do As-docs-ai>" \
#     --from-literal=DATABASE_URL="postgresql://USUARIO:SENHA@<endpoint-rds>:5432/asdocs?sslmode=require"
# Alternativa recomendada: AWS Secrets Manager + External Secrets Operator.
apiVersion: v1
kind: Secret
metadata:
  name: as-docs-backend-secret
  namespace: as-docs
type: Opaque
stringData:
  APP_SECRET: "trocar"
  DOCS_AI_HMAC_SECRET: "trocar"
  DATABASE_URL: "postgresql://USUARIO:SENHA@as-docs.xxxx.us-east-1.rds.amazonaws.com:5432/asdocs?sslmode=require"
  AWS_S3_ACCESS_KEY_ID: ""
  AWS_S3_SECRET_ACCESS_KEY: ""
