name: CI - As-docs-app

# Fluxo: feature/* -> Pull Request -> main (protegida) -> tag vX.Y.Z (CD).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Testes, lint e build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.15.1
          run_install: false
      - name: Instalar dependências
        run: pnpm install --frozen-lockfile
      - name: Build dos projetos
        run: pnpm run build
      - name: Testes do backend
        run: pnpm --filter ./apps/server exec jest --ci --runInBand
      - name: Testes do frontend
        run: pnpm --filter ./apps/client exec vitest run
      - name: ESLint do backend
        run: pnpm --filter ./apps/server exec eslint "{src,apps,libs,test}/**/*.ts" --no-error-on-unmatched-pattern
      - name: ESLint do frontend
        run: pnpm --filter ./apps/client exec eslint .

  image:
    name: Imagem ${{ matrix.service }} + Trivy
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Build da imagem (sem publicar)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ${{ matrix.service }}/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: as-docs-${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max
      # Achados vão para a aba Security; o bloqueio de alertas novos alto/crítico
      # é feito pela regra de code scanning da branch protegida.
      - name: Trivy (vulnerabilidades da imagem)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: as-docs-${{ matrix.service }}:ci
          format: sarif
          output: trivy-${{ matrix.service }}.sarif
          severity: MEDIUM,HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'
      - uses: github/codeql-action/upload-sarif@74c1aea9df7c0f02e9b7bfe4a8935abf2e5e3aa6 # v3.39.5
        if: always()
        with:
          sarif_file: trivy-${{ matrix.service }}.sarif
          category: trivy-image-${{ matrix.service }}
