name: CD - Backend (AWS Academy)

on:
  push:
    branches: [feature/aws-academy-deploy]
    paths:
      - 'backend/**'
      - 'apps/server/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - '.github/workflows/cd-backend-aws.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: 'build = validar; publish = ECR; deploy = ECR + EKS'
        required: true
        type: choice
        default: build
        options: [build, publish, deploy]
      confirmation:
        description: 'Para deploy, digite DEPLOY'
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: cd-as-docs-backend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      AWS_REGION: us-east-1
      EKS_CLUSTER: as-docs-eks
      EKS_NAMESPACE: as-docs
      ECR_IMAGE: 362749056012.dkr.ecr.us-east-1.amazonaws.com/as-docs-backend

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Configurar Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'

      - name: Configurar pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: 11.15.1
          run_install: false

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Build da aplicacao
        run: pnpm run build

      - name: Testes do backend
        run: pnpm --filter ./apps/server exec jest --ci --runInBand

      - name: Lint do backend
        run: pnpm --filter ./apps/server exec eslint "{src,apps,libs,test}/**/*.ts" --no-error-on-unmatched-pattern

      - name: Validar publicacao manual
        if: ${{ vars.AS_DOCS_AWS_CD_ENABLED == 'true' && github.event_name == 'workflow_dispatch' && inputs.mode != 'build' }}
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/feature/aws-academy-deploy" ]; then
            echo "::error::Publicacao permitida somente pela branch de deploy."
            exit 1
          fi

          if [ "${{ inputs.mode }}" = "deploy" ] && [ "$CONFIRMATION" != "DEPLOY" ]; then
            echo "::error::Para deploy, digite DEPLOY."
            exit 1
          fi

      - name: Bloquear publicacao AWS desabilitada
        if: ${{ vars.AS_DOCS_AWS_CD_ENABLED != 'true' && github.event_name == 'workflow_dispatch' && inputs.mode != 'build' }}
        run: |
          echo "::error::Publicacao e deploy AWS pelo GitHub estao desabilitados. Use os scripts locais."
          exit 1

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Configurar credenciais AWS Academy
        if: ${{ vars.AS_DOCS_AWS_CD_ENABLED == 'true' && github.event_name == 'workflow_dispatch' && inputs.mode != 'build' }}
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: us-east-1
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}

      - name: Validar conta AWS
        if: ${{ vars.AS_DOCS_AWS_CD_ENABLED == 'true' && github.event_name == 'workflow_dispatch' && inputs.mode != 'build' }}
        run: |
          account="$(aws sts get-caller-identity --query Account --output text)"
          if [ "$account" != "362749056012" ]; then
            echo "::error::Conta AWS inesperada: $account"
            exit 1
          fi

      - name: Login no Amazon ECR
        if: ${{ vars.AS_DOCS_AWS_CD_ENABLED == 'true' && github.event_name == 'workflow_dispatch' && inputs.mode != 'build' }}
        uses: aws-actions/amazon-ecr-login@7290e214a610b32bc0eef81748948b6d466a8783 # v2

      - name: Construir imagem do backend
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./backend/Dockerfile
          platforms: linux/amd64
          push: ${{ vars.AS_DOCS_AWS_CD_ENABLED == 'true' && github.event_name == 'workflow_dispatch' && inputs.mode != 'build' }}
          tags: ${{ env.ECR_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=as-docs-backend
          cache-to: type=gha,mode=max,scope=as-docs-backend

      - name: Instalar kubectl
        if: ${{ vars.AS_DOCS_AWS_CD_ENABLED == 'true' && github.event_name == 'workflow_dispatch' && inputs.mode == 'deploy' }}
        uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4
        with:
          version: v1.37.0

      - name: Atualizar backend no EKS
        if: ${{ vars.AS_DOCS_AWS_CD_ENABLED == 'true' && github.event_name == 'workflow_dispatch' && inputs.mode == 'deploy' }}
        shell: bash
        run: |
          set -euo pipefail

          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER"

          old_image="$(kubectl -n "$EKS_NAMESPACE" \
            get deployment/as-docs-backend \
            -o jsonpath='{.spec.template.spec.containers[?(@.name=="backend")].image}')"

          new_image="${ECR_IMAGE}:${GITHUB_SHA}"

          echo "Atualizando backend."

          kubectl -n "$EKS_NAMESPACE" \
            set image deployment/as-docs-backend backend="$new_image"

          if ! kubectl -n "$EKS_NAMESPACE" \
            rollout status deployment/as-docs-backend --timeout=600s; then

            echo "::error::Rollout falhou. Tentando restaurar imagem anterior."

            kubectl -n "$EKS_NAMESPACE" \
              set image deployment/as-docs-backend backend="$old_image"

            kubectl -n "$EKS_NAMESPACE" \
              rollout status deployment/as-docs-backend --timeout=600s || true

            exit 1
          fi

          kubectl -n "$EKS_NAMESPACE" get deployment/as-docs-backend