name: Segurança - As-docs-app

# SAST, segredos, dependências (SCA) e IaC. Os achados são publicados na aba
# Security (SARIF). Política: bloqueiam apenas achados NOVOS de severidade
# alta/crítica (dependency-review, gitleaks e regra de code scanning da main);
# IaC e severidade média apenas alertam.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 9 * * 1' # semanal, segunda 06:00 (BRT)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: SAST - CodeQL (JS/TS)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
        with:
          category: codeql-js-ts

  gitleaks:
    name: Segredos - Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Em PR/push analisa apenas os commits novos; segredo novo bloqueia.
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-review:
    name: SCA - Dependency Review (PR)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  pnpm-audit:
    name: SCA - pnpm audit (relatório)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: 11.15.1
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      # Vulnerabilidades já existentes não bloqueiam (dependências novas são
      # barradas pelo dependency-review); o resultado fica no resumo do job.
      - name: pnpm audit (alta/crítica)
        run: |
          {
            echo '## pnpm audit (alta/crítica)'
            echo '```'
            pnpm audit --prod --audit-level high || true
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

  iac:
    name: IaC - Trivy config (alerta)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Trivy config (Terraform, Kubernetes, Dockerfiles)
        uses: aquasecurity/trivy-action@0.33.1
        with:
          scan-type: config
          scan-ref: .
          format: sarif
          output: trivy-iac.sarif
          severity: MEDIUM,HIGH,CRITICAL
          exit-code: '0'
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-iac.sarif
          category: trivy-iac
