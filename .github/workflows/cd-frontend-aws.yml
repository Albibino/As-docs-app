name: CD - Frontend (ECR / AWS Academy)

on:
  push:
    branches: [feature/aws-academy-deploy]
    paths:
      - 'frontend/**'
      - 'apps/client/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - 'nx.json'
      - '.github/workflows/cd-frontend-aws.yml'
      - '.github/scripts/deploy-frontend-ssm.sh'

  workflow_dispatch:
    inputs:
      mode:
        description: 'build = validar; publish = ECR; deploy = ECR + EC2'
        required: true
        type: choice
        default: build
        options: [build, publish, deploy]
      confirmation:
        description: 'Para deploy, digite DEPLOY'
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: cd-as-docs-frontend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      AWS_REGION: us-east-1
      ECR_IMAGE: 362749056012.dkr.ecr.us-east-1.amazonaws.com/as-docs-frontend

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Configurar Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'

      - name: Configurar pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: 11.15.1
          run_install: false

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Build do frontend
        run: pnpm nx run client:build

      - name: Testes do frontend
        run: pnpm --filter ./apps/client exec vitest run

      - name: Lint do frontend
        run: pnpm --filter ./apps/client exec eslint .

      - name: Restringir publicacao e exigir confirmacao
        if: ${{ vars.AS_DOCS_AWS_CD_ENABLED == 'true' && github.event_name == 'workflow_dispatch' && inputs.mode != 'build' }}
        env:
          MODE: ${{ inputs.mode }}
          CONFIRMATION: ${{ inputs.confirmation }}
        shell: bash
        run: |
          set -euo pipefail

          if [ "$GITHUB_REF" != 'refs/heads/feature/aws-academy-deploy' ]; then
            echo '::error::Publicacao permitida somente na branch de deploy'
            exit 1
          fi

          if [ "$MODE" = deploy ] && [ "$CONFIRMATION" != DEPLOY ]; then
            echo '::error::Para deploy, digite DEPLOY'
            exit 1
          fi

      - name: Bloquear publicacao AWS desabilitada
        if: ${{ vars.AS_DOCS_AWS_CD_ENABLED != 'true' && github.event_name == 'workflow_dispatch' && inputs.mode != 'build' }}
        run: |
          echo "::error::Publicacao e deploy AWS pelo GitHub estao desabilitados. Use os scripts locais."
          exit 1

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Configurar AWS Academy
        if: ${{ vars.AS_DOCS_AWS_CD_ENABLED == 'true' && github.event_name == 'workflow_dispatch' && inputs.mode != 'build' }}
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: us-east-1
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}

      - name: Confirmar conta AWS
        if: ${{ vars.AS_DOCS_AWS_CD_ENABLED == 'true' && github.event_name == 'workflow_dispatch' && inputs.mode != 'build' }}
        shell: bash
        run: |
          set -euo pipefail

          account="$(aws sts get-caller-identity --query Account --output text)"

          test "$account" = '362749056012' || {
            echo '::error::Conta AWS inesperada'
            exit 1
          }

      - name: Login no ECR
        if: ${{ vars.AS_DOCS_AWS_CD_ENABLED == 'true' && github.event_name == 'workflow_dispatch' && inputs.mode != 'build' }}
        uses: aws-actions/amazon-ecr-login@7290e214a610b32bc0eef81748948b6d466a8783 # v2

      - name: Build e publicacao controlada no ECR
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./frontend/Dockerfile
          platforms: linux/amd64
          push: ${{ vars.AS_DOCS_AWS_CD_ENABLED == 'true' && github.event_name == 'workflow_dispatch' && inputs.mode != 'build' }}
          tags: ${{ env.ECR_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=as-docs-frontend
          cache-to: type=gha,mode=max,scope=as-docs-frontend

      - name: Atualizar EC2 via SSM, uma por vez
        if: ${{ vars.AS_DOCS_AWS_CD_ENABLED == 'true' && github.event_name == 'workflow_dispatch' && inputs.mode == 'deploy' }}
        shell: bash
        run: |
          set -euo pipefail

          for instance in i-0a2e4ac26e26672f0 i-0ab933613d0ceacd7; do
            echo "Atualizando instancia $instance"
            export SSM_INSTANCE_ID="$instance"

            python3 - <<'PY'
          import json
          import os
          import shlex
          from pathlib import Path

          image = os.environ['ECR_IMAGE'] + ':' + os.environ['GITHUB_SHA']
          script = Path('.github/scripts/deploy-frontend-ssm.sh').read_text(encoding='utf-8')

          command = f"NEW_IMAGE={shlex.quote(image)} bash <<'__ASDOCS_DEPLOY_EOF__'\n{script}\n__ASDOCS_DEPLOY_EOF__"

          payload = {
              'DocumentName': 'AWS-RunShellScript',
              'InstanceIds': [os.environ['SSM_INSTANCE_ID']],
              'Comment': 'CD As-docs frontend - deploy controlado',
              'TimeoutSeconds': 600,
              'Parameters': {'commands': [command]},
          }

          Path('/tmp/asdocs-ssm-command.json').write_text(
              json.dumps(payload),
              encoding='utf-8'
          )
          PY

            command_id="$(aws ssm send-command \
              --cli-input-json file:///tmp/asdocs-ssm-command.json \
              --query Command.CommandId --output text)"

            status=Pending

            for _ in $(seq 1 120); do
              status="$(aws ssm get-command-invocation \
                --command-id "$command_id" \
                --instance-id "$instance" \
                --query Status --output text 2>/dev/null || echo Pending)"

              case "$status" in
                Success|Failed|TimedOut|Cancelled|Cancelling) break ;;
              esac

              sleep 5
            done

            aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$instance" \
              --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
              --output json

            if [ "$status" != Success ]; then
              echo "::error::Falha na instancia $instance. A proxima nao sera atualizada."
              exit 1
            fi
          done